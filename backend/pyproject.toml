[project]
name = "light-crm-backend"
version = "0.1.0"
description = "Light B2B CRM: JSON API, background worker and CLI"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "fastapi==0.163.1",
    "openpyxl==3.1.5",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "httpx==0.28.1",
    "import-linter==2.16",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-openpyxl==3.1.5.20250919",
]

[tool.uv]
package = false

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions/*.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "T20", "DTZ",
]
# Bulgarian (Cyrillic) text is part of the product, not a confusable typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "N802"]
"app/cli.py" = ["T201"]
"app/core/errors.py" = ["S105"]  # error codes such as auth.token_invalid are not secrets
"tests/api/catalog_pending.py" = ["E501"]
"alembic/versions/*" = ["E501"]  # migrations keep generated column lines intact

[tool.ruff.lint.isort]
# The local alembic/ directory holds migrations; the package is third-party.
known-third-party = ["alembic"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic", "tests"]

[[tool.mypy.overrides]]
# factory-boy ships no type information.
module = ["tests.factories"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--strict-markers --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=75"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

# --- import-linter (architecture section 3, module boundary rules) ----------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level layering: entry points > modules > llm > core"
type = "layers"
layers = [
    "app.cli",
    "app.main | app.worker",
    "app.modules",
    "app.llm",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Module dependency direction (nothing depends on assistant or integration)"
type = "layers"
containers = ["app.modules"]
layers = [
    "assistant | integration",
    "dataimport | reporting | audit",
    "activity",
    "sales",
    "party",
    "identity",
]

[[tool.importlinter.contracts]]
name = "Inside a module: router > service > repository > models"
type = "layers"
containers = [
    "app.modules.identity",
    "app.modules.party",
    "app.modules.sales",
    "app.modules.activity",
    "app.modules.reporting",
    "app.modules.dataimport",
    "app.modules.audit",
    "app.modules.integration",
    "app.modules.assistant",
]
layers = ["router", "service", "repository", "models"]

[[tool.importlinter.contracts]]
name = "Routers never touch the database"
type = "forbidden"
source_modules = ["app.modules.*.router"]
forbidden_modules = ["app.modules.*.repository", "app.modules.*.models", "sqlalchemy"]
# Routers reach the database only through their service; direct imports are banned.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only app.llm may import litellm"
type = "forbidden"
source_modules = ["app.main", "app.worker", "app.cli", "app.core", "app.modules"]
forbidden_modules = ["litellm"]

# Modules talk to each other only through service functions: for each module,
# no other module may import its router, repository or models directly. (Reaching
# them through the module's own service is the intended path.)
[[tool.importlinter.contracts]]
name = "identity internals are private"
type = "forbidden"
source_modules = ["app.modules.party", "app.modules.sales", "app.modules.activity", "app.modules.reporting", "app.modules.dataimport", "app.modules.audit", "app.modules.integration", "app.modules.assistant"]
forbidden_modules = ["app.modules.identity.router", "app.modules.identity.repository", "app.modules.identity.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
