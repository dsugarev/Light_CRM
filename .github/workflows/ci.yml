# Quality gates (architecture section 9, test strategy section 9):
# lint, type checks, unit/API/migration tests, frontend tests, contract drift,
# i18n key check, dependency audit, image build, Playwright on the composed stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  NODE_VERSION: "26.13.1"

jobs:
  backend:
    name: Backend (ruff, mypy, import-linter, pytest, pip-audit)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-trixie
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://crm_migrator:ci-migrator@localhost:5432/crm_test
      TEST_APP_DATABASE_URL: postgresql+asyncpg://crm_app:ci-app@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Create database roles
        run: ../deploy/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          CRM_DB_NAME: crm_test
          CRM_MIGRATOR_PASSWORD: ci-migrator
          CRM_APP_PASSWORD: ci-app
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - name: Dependency audit (all locked packages, hashes verified)
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, i18n, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:i18n
      - name: Dependency audit
        run: pnpm audit --audit-level high

  contract:
    name: API contract (generated types up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Export the OpenAPI document
        working-directory: backend
        run: uv sync --frozen && uv run python -m app.cli export-openapi --output "$RUNNER_TEMP/openapi.json"
      - name: Regenerate frontend API types
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm generate:api "$RUNNER_TEMP/openapi.json"
      - name: Fail if the committed types are stale
        run: git diff --exit-code -- frontend/src/api/schema.d.ts
      - name: Fail if the API documentation snapshot is stale
        run: diff -u docs/api/openapi.json "$RUNNER_TEMP/openapi.json"

  e2e:
    name: End-to-end (Playwright on the composed stack)
    needs: [backend, frontend, contract]
    runs-on: ubuntu-24.04
    env:
      # The production-like stack plus the scripted model provider for the assistant
      # journeys (ADR 0026); every docker compose command below uses both files.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure the stack
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^CRM_MIGRATOR_PASSWORD=.*/CRM_MIGRATOR_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^CRM_APP_PASSWORD=.*/CRM_APP_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^APP_SECRET_KEY=.*/APP_SECRET_KEY=$(openssl rand -hex 32)/" \
              -e "s/^APP_ENCRYPTION_KEY=.*/APP_ENCRYPTION_KEY=$(openssl rand -hex 32)/" \
              .env.example > .env
          # Every browser shares one IP address in CI; keep the per-IP limits out of the way.
          printf 'RATE_LIMIT_LOGIN_PER_MINUTE=500\nRATE_LIMIT_PASSWORD_PER_15_MINUTES=500\n' >> .env
          # Webhook screens: a host that never resolves, so test events fail visibly.
          printf 'WEBHOOK_ALLOWED_HOSTS=hooks.example.test\n' >> .env
      - name: Build images and start the stack
        run: docker compose up --build --detach
      - name: Wait for readiness through the proxy
        run: |
          for _ in $(seq 1 90); do
            curl --silent --fail --insecure https://localhost/api/health/ready && exit 0
            sleep 2
          done
          docker compose ps; exit 1
      - name: Create the E2E admin accounts with the CLI
        run: |
          password="E2e-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          for locale in en bg; do
            echo "$password" | docker compose exec -T backend python -m app.cli create-admin \
              --email "e2e-admin-$locale@example.test" --full-name "E2E Admin $locale" \
              --locale "$locale" --password-stdin
          done
          {
            echo "E2E_ADMIN_PASSWORD=$password"
            echo "E2E_ADMIN_EMAIL_EN=e2e-admin-en@example.test"
            echo "E2E_ADMIN_EMAIL_BG=e2e-admin-bg@example.test"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium firefox
      - name: Run Playwright
        working-directory: frontend
        run: pnpm e2e
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            compose.log
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
